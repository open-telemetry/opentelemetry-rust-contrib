[graph]
exclude=[]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "OpenSSL"
]

[licenses.private]
ignore = true

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[advisories]
unmaintained = "none"
yanked = "allow"
ignore = [
    # http-types is unmaintained; no patched version available.
    # Reaches the graph transitively only via opentelemetry-datadog's optional
    # `surf-client` feature (surf -> http-client -> http-types). The datadog
    # exporter is planned for removal (see #609), at which point this entry
    # can be dropped.
    "RUSTSEC-2026-0174",
    # quick-xml 0.26.0; dev-only via pprof -> inferno. No upstream fix yet.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # h2 0.3.27; transitively required by awc and actix-http. The fix is only
    # available in h2 0.4.16+, which Actix does not support yet:
    # https://github.com/actix/actix-web/issues/4199
    "RUSTSEC-2026-0258",
]
