# Application specific configurations
version: 1.0.0
service:
  # Telemetry configuration
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: "test-service"
        - name: service.version
          value: "1.0.0"
    metrics:
      readers:
        - periodic:
            interval: 60000
            exporter:
              custom:
                custom_string_field: "delta"
                custom_int_field: 42
