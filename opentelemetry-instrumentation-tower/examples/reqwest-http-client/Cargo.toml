[package]
name = "example-reqwest-http-client"
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.75.0"

[dependencies]
opentelemetry_instrumentation_tower = { path = "../../", package = "opentelemetry-instrumentation-tower", features = ["http-client"], default-features = false }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, default-features = false }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "metrics", "trace"], default-features = false }
# Keep tower-reqwest on 0.4.0 to avoid an MSRV bump. 0.4.0 is the last
# release that supports Rust 1.75, the MSRV of this crate. The pin is exact
# because 0.4.1 already needs Rust 1.78. tower-reqwest 0.4 depends on
# reqwest 0.12, so reqwest stays on 0.12 too. Bump both together when the
# MSRV is raised.
reqwest = { version = "0.12" }
tower-reqwest = { version = "=0.4.0", default-features = false }
http = { version = "1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], default-features = false }
tower = { version = "0.5", features = ["util"], default-features = false }

[lints]
workspace = true
