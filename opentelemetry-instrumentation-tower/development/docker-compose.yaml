networks:
  echo-server:
    name: "echo-server"

services:
  example-axum-server:
    build:
      context: ../../
      dockerfile: ./opentelemetry-instrumentation-tower/examples/axum-http-service/Dockerfile.axum
    container_name: http-server
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_METRIC_EXPORT_INTERVAL=10000
    networks:
      echo-server:
    ports:
      - "5000:5000"

  example-hyper-server:
    build:
      context: ../../
      dockerfile: ./opentelemetry-instrumentation-tower/examples/hyper-http-service/Dockerfile.hyper
    container_name: http-server
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_METRIC_EXPORT_INTERVAL=10000
    networks:
      echo-server:
    ports:
      - "5000:5000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    container_name: otel-collector
    command:
      - "--config=/etc/otel-collector-config.yaml"
    networks:
      echo-server:
    ports:
      - "4317:4317"
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml

  mimir:
    image: grafana/mimir:latest@sha256:32d79dc873a804d4dbf2724afcbb7b141553b5ed9118f9295972c4bb2982d6fd
    container_name: mimir
    command: [ "-config.file=/mimir/config/mimir.yaml" ]
    networks:
      echo-server:
    ports:
      - "8001:8001"
    volumes:
      - ./config/mimir.yaml:/mimir/config/mimir.yaml

  grafana:
    image: grafana/grafana:latest@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    networks:
      echo-server:
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana-datasource-mimir.yaml:/etc/grafana/provisioning/datasources/mimir.yaml

  k6-load-gen:
    image: grafana/k6:latest@sha256:3d8e5c7f1d53ec59408c2ffbd9943602a0985ffcbd4a2430ec00f3ffca89796e
    container_name: k6-load-gen
    command:
      - "run"
      - "/scripts/echo-all.js"
    networks:
      echo-server:
    volumes:
      - ./load-gen:/scripts
